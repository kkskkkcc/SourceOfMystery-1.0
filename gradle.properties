org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false
org.gradle.parallel=true

# 跳过 ForgeGradle 的证书验证（避免网络环境下证书校验失败）
systemProp.net.minecraftforge.gradle.test_certs=false

# 本机 JDK 绝对路径（原 D:/MCmodfind/jdk），已注释以免影响他人构建；构建请使用 JDK 17
# org.gradle.java.home=D:/MCmodfind/jdk

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.2.0
forge_version_range=[47.2.0,48.0.0)
loader_version_range=[47,48)

mod_id=sourceofmystery
mod_name=SourceOfMystery
mod_license=MIT
mod_version=1.0.0
mod_group=com.sourceofmystery