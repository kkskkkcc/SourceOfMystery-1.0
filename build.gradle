plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}
version = '1.0.0'
group = 'com.sourceofmystery'
base {
    archivesName = 'sourceofmystery'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
mixin {
    add sourceSets.main, 'sourceofmystery.refmap.json'
    config 'sourceofmystery.mixins.json'
}
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    shaderTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        gameTestServer {
            workingDirectory project.file('build/outsider-gametest')
            property 'forge.enabledGameTestNamespaces', 'sourceofmystery'
            property 'forge.logging.console.level', 'info'
            mods {
                sourceofmystery {
                    source sourceSets.main
                    source sourceSets.gameTest
                }
            }
        }
        client {
            workingDirectory project.file('run')
            if (project.hasProperty('staffCheck')) {
                workingDirectory project.file('build/staff-client-check')
                property 'sourceofmystery.staffCheck', 'true'
                args '--username', 'StaffCheck', '--width', '1280', '--height', '720'
                mods { sourceofmystery { source sourceSets.gameTest } }
            }
            if (project.hasProperty('gearCheck')) {
                workingDirectory project.file('build/gear-client-check')
                property 'sourceofmystery.gearCheck', 'true'
                args '--username', 'GearCheck', '--width', '1280', '--height', '720'
                mods { sourceofmystery { source sourceSets.gameTest } }
            }
            if (project.hasProperty('outsiderCheck')) {
                workingDirectory project.file('build/outsider-client-check')
                property 'sourceofmystery.outsiderCheck', 'true'
                args '--username', 'OutsiderCheck', '--width', '1280', '--height', '720'
                mods { sourceofmystery { source sourceSets.gameTest } }
            }
            if (project.hasProperty('ritualCheck')) {
                workingDirectory project.file('build/ritual-client-check')
                property 'sourceofmystery.ritualCheck', 'true'
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
                mods { sourceofmystery { source sourceSets.gameTest } }
            }
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'sourceofmystery'
            mods {
                sourceofmystery {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'sourceofmystery'
            mods {
                sourceofmystery {
                    source sourceSets.main
                }
            }
        }
        // 数据生成：./gradlew runData，输出到 src/generated/resources
        data {
            workingDirectory project.file('run-data')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'sourceofmystery', '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
            mods {
                sourceofmystery {
                    source sourceSets.main
                }
            }
        }
    }
}
// 数据生成的产物与手写资源一起打包
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.8.4")

    // JEI（可选依赖）：编译只需要 API，开发环境运行时带上完整 JEI 方便测试
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")
}

repositories {
    maven {
        name = 'Minecraft Forge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'Jared (JEI)'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'ModMaven (JEI mirror)'
        url = 'https://modmaven.dev/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupByRegex("software\\.bernie.*") }
    }
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// `gradle jar` 默认输出开发用 jar（仍带官方字段名），放到玩家 mods/ 里会报
// NoSuchFieldError: Registries.CREATIVE_MODE_TAB。让 `jar` 走完 `reobfJar`，
// 并把 SRG 重命名后的 jar 覆盖回 build/libs/，发布到 mods/ 才不会崩。
jar.finalizedBy('reobfJar')
tasks.register('shaderCheckJar', Jar) {
    archiveClassifier = 'shader-check'
    from sourceSets.main.output
    from sourceSets.shaderTest.output
}
reobf { shaderCheckJar {} }
tasks.named('shaderCheckJar').configure { finalizedBy('reobfShaderCheckJar') }
afterEvaluate {
    tasks.named('reobfJar').configure {
        doLast {
            def reobfed = file('build/reobfJar/output.jar')
            def target = file('build/libs/sourceofmystery-1.0.0.jar')
            if (reobfed.exists()) {
                target.delete()
                copy { from reobfed; into 'build/libs'; rename { 'sourceofmystery-1.0.0.jar' } }
            }
        }
    }
}
